<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CƯỜNG SOÁI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at center, #222 0%, #111 45%, #080808 100%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    background:#090909;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    animation:introOut .8s ease forwards;
    animation-delay:2s;
}

.logoIntro{
    font-size:clamp(38px,10vw,85px);
    font-weight:900;
    letter-spacing:5px;

    background:linear-gradient(
        90deg,
        #fff,
        #aaa,
        #fff,
        #777,
        #fff
    );

    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;

    animation:
        shine 2s linear infinite,
        zoom 1.5s ease;
    
    text-shadow:
        0 0 15px rgba(255,255,255,.2),
        0 0 35px rgba(255,255,255,.08);
}

@keyframes shine{
    0%{background-position:0%}
    100%{background-position:300%}
}

@keyframes zoom{
    from{
        transform:scale(.6);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes introOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* ================= MAIN ================= */

.container{
    width:min(92%,430px);
    text-align:center;
    position:relative;
    z-index:2;
}

.main-title{
    font-size:28px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
}

.sub{
    color:#888;
    font-size:14px;
    margin-bottom:30px;
}

/* BUTTON */

.showBtn{
    width:100%;
    padding:18px 20px;
    border:none;
    border-radius:16px;

    background:linear-gradient(
        135deg,
        #333,
        #171717
    );

    color:white;
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.1);

    transition:.3s;
}

.showBtn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 15px 40px rgba(0,0,0,.7),
        0 0 25px rgba(255,255,255,.08);
}

.showBtn:active{
    transform:scale(.97);
}

/* ================= QR ================= */

#qrBox{
    display:none;
    margin-top:25px;
    padding:22px;

    background:#151515;
    border:1px solid #333;
    border-radius:22px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.6);
    
    animation:popup .4s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.8) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

#qrcode{
    background:white;
    padding:12px;
    border-radius:12px;
    display:inline-block;
}

#qrcode img{
    display:block;
}

.qrText{
    margin-top:15px;
    color:#aaa;
    font-size:13px;
}

.closeQR{
    margin-top:15px;
    padding:10px 20px;
    background:#252525;
    border:1px solid #444;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
}

/* ================= INFO PAGE ================= */

#infoPage{
    display:none;
    width:min(94%,500px);
    max-height:95vh;
    overflow:auto;
    padding:20px 0;
}

.profile{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;

    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#333,#111);

    border:2px solid #444;

    font-size:28px;
    font-weight:bold;

    box-shadow:0 0 30px rgba(255,255,255,.08);
}

.profile h1{
    margin-top:15px;
    font-size:27px;
}

.profile p{
    color:#777;
    margin-top:6px;
}

.infoCard{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;

    padding:16px;
    margin-bottom:13px;

    display:flex;
    align-items:center;
    gap:14px;

    transition:.25s;
}

.infoCard:hover{
    transform:translateY(-2px);
    background:#1b1b1b;
}

.icon{
    width:50px;
    height:50px;
    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#222;
    font-size:24px;
    flex-shrink:0;
}

.info{
    text-align:left;
    flex:1;
    min-width:0;
}

.info .name{
    font-size:13px;
    color:#777;
    margin-bottom:4px;
}

.info .value{
    font-size:16px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.action{
    display:flex;
    gap:7px;
}

.action button,
.action a{
    text-decoration:none;
    border:none;
    background:#292929;
    color:white;

    min-width:42px;
    height:40px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.action button:hover,
.action a:hover{
    background:#3a3a3a;
}

.copyMsg{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(20px);

    background:#eee;
    color:#111;

    padding:11px 18px;
    border-radius:12px;

    font-size:14px;
    font-weight:bold;

    opacity:0;
    pointer-events:none;

    transition:.3s;

    z-index:9999;
}

.copyMsg.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* mobile */

@media(max-width:400px){
    .infoCard{
        padding:12px;
    }

    .icon{
        width:44px;
        height:44px;
    }

    .info .value{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- ================= INTRO ================= -->

<div id="intro">
    <div class="logoIntro">
        CƯỜNG SOÁI
    </div>
</div>


<!-- ================= MAIN ================= -->

<div class="container" id="mainPage">

    <div class="main-title">
        CƯỜNG SOÁI
    </div>

    <div class="sub">
        Quét mã để xem thông tin liên hệ
    </div>

    <button class="showBtn" onclick="showQR()">
        ◈ &nbsp; HIỆN MÃ KẾT BẠN
    </button>

    <div id="qrBox">

        <div id="qrcode"></div>

        <div class="qrText">
            Dùng camera điện thoại để quét mã
        </div>

        <button class="closeQR" onclick="closeQR()">
            ĐÓNG
        </button>

    </div>

</div>


<!-- ================= INFO PAGE ================= -->

<div id="infoPage">

    <div class="profile">

        <div class="avatar">
            C
        </div>

        <h1 id="profileName">
            CƯỜNG SOÁI
        </h1>

        <p>
            Thông tin liên hệ
        </p>

    </div>


    <!-- ZALO -->

    <div class="infoCard">

        <div class="icon">
            💬
        </div>

        <div class="info">

            <div class="name">
                ZALO
            </div>

            <div class="value" id="zaloText">
                0987654321
            </div>

        </div>

        <div class="action">

            <button onclick="copyText('0987654321')">
                ⧉
            </button>

            <a
                href="https://zalo.me/0987654321"
                target="_blank">
                ↗
            </a>

        </div>

    </div>


    <!-- FACEBOOK -->

    <div class="infoCard">

        <div class="icon">
            f
        </div>

        <div class="info">

            <div class="name">
                FACEBOOK
            </div>

            <div class="value">
                Cường Soái
            </div>

        </div>

        <div class="action">

            <button onclick="copyText('https://facebook.com/')">
                ⧉
            </button>

            <a
                href="https://facebook.com/"
                target="_blank">
                ↗
            </a>

        </div>

    </div>


    <!-- TIKTOK -->

    <div class="infoCard">

        <div class="icon">
            ♪
        </div>

        <div class="info">

            <div class="name">
                TIKTOK
            </div>

            <div class="value">
                @cuongsoai
            </div>

        </div>

        <div class="action">

            <button onclick="copyText('https://www.tiktok.com/@cuongsoai')">
                ⧉
            </button>

            <a
                href="https://www.tiktok.com/@cuongsoai"
                target="_blank">
                ↗
            </a>

        </div>

    </div>


    <!-- SỐ ĐIỆN THOẠI -->

    <div class="infoCard">

        <div class="icon">
            ☎
        </div>

        <div class="info">

            <div class="name">
                SỐ ĐIỆN THOẠI
            </div>

            <div class="value">
                0987654321
            </div>

        </div>

        <div class="action">

            <button onclick="copyText('0987654321')">
                ⧉
            </button>

            <a href="tel:0987654321">
                ☎
            </a>

        </div>

    </div>

</div>


<div class="copyMsg" id="copyMsg">
    Đã sao chép ✓
</div>


<!-- QR LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

/* =================================================
   THÔNG TIN CỦA BẠN
   CHỈ CẦN SỬA PHẦN NÀY
================================================= */

const TEN = "CƯỜNG SOÁI";

const ZALO = "0364475143";

const FACEBOOK_NAME = "Cường Soái";
const FACEBOOK_LINK = "https://www.facebook.com/share/1JPuGePTfG/";

const TIKTOK_NAME = "@anhsoaid12";
const TIKTOK_LINK = "https://www.tiktok.com/@anhsoaid12?_r=1&_t=ZS-98uFzAaSuUG";

const SDT = "0364475143";


/* =================================================
   HIỆN QR
================================================= */

function showQR(){

    document.getElementById("qrBox").style.display="block";

    document.getElementById("qrcode").innerHTML="";

    /*
      QR sẽ mở chính website này với ?info=1
    */

    let url =
        window.location.origin +
        window.location.pathname +
        "?info=1";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text:url,
            width:210,
            height:210,
            colorDark:"#000000",
            colorLight:"#ffffff",
            correctLevel:QRCode.CorrectLevel.H
        }
    );
}


/* =================================================
   ĐÓNG QR
================================================= */

function closeQR(){

    document.getElementById("qrBox").style.display="none";

}


/* =================================================
   COPY
================================================= */

function copyText(text){

    navigator.clipboard.writeText(text);

    let msg=document.getElementById("copyMsg");

    msg.classList.add("show");

    setTimeout(function(){
        msg.classList.remove("show");
    },1500);

}


/* =================================================
   CẬP NHẬT THÔNG TIN
================================================= */

document.getElementById("profileName").innerText=TEN;

document.getElementById("zaloText").innerText=ZALO;


/* =================================================
   NẾU TRUY CẬP ?info=1
   → HIỆN TRANG THÔNG TIN
================================================= */

const params =
    new URLSearchParams(window.location.search);

if(params.get("info")==="1"){

    document.getElementById("mainPage").style.display="none";

    document.getElementById("infoPage").style.display="block";

    document.body.style.overflow="auto";

}


/* =================================================
   INTRO
================================================= */

setTimeout(function(){

    document.getElementById("intro").style.display="none";

},2800);

</script>

</body>
</html>
